<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Style File -->
    <link rel="stylesheet" href="./assets/Style/main-style.css" />
    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Calculator App</title>
  </head>
  <body>
    <!-- Calculator App Container -->
    <div class="container">
      <header>
        <span class="logo">calc</span>
        <div class="theme-toggle">
          <h4>theme</h4>
          <div class="toggle-wrapper">
            <div class="status">
              <span data-theme="light">1</span>
              <span data-theme="dark">2</span>
              <span data-theme="eco">3</span>
            </div>
            <div class="toggle-switch" id="toggleSwitch">
              <!-- <div class="slider"> -->
              <span class="circle" id="circle"></span>
            </div>
          </div>
        </div>
      </header>
      <input type="text" class="show-num" id="showNum" placeholder="0" />
      <div class="keys-wrapper">
        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="del-key key" id="delete">Del</button>

        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        <button class="key" id="plus">+</button>

        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key" id="minus">-</button>

        <button class="key">.</button>
        <button class="key">0</button>
        <button id="divide" class="key">/</button>
        <button id="multiply" class="key">×</button>

        <button class="reset-key key" id="reset">Reset</button>
        <button class="equal-key key" id="equal">=</button>
      </div>
    </div>

    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
    <!-- JS File -->
    <script src="./assets/JS/main-app.js"></script>
  </body>
</html>
